name: Deploy Supabase Edge Function (Mercado Pago webhook)

on:
  workflow_dispatch: {}
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install supabase CLI
        run: npm install -g supabase

      - name: Supabase login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --access-token $SUPABASE_ACCESS_TOKEN

      - name: Set Supabase secrets (optional)
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Set server-side secrets in the Supabase project (no-op if already set)
          supabase secrets set MERCADO_PAGO_ACCESS_TOKEN="${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}" \
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            VITE_MP_LIFETIME_PREFERENCE_ID="${{ secrets.VITE_MP_LIFETIME_PREFERENCE_ID }}" \
            --project-ref $SUPABASE_PROJECT_REF || true

      - name: Deploy mercadopago-webhook function
        working-directory: ./app/backend/edge_functions/mercadopago-webhook
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy mercadopago-webhook --project-ref $SUPABASE_PROJECT_REF
