# Deploy manual (backup) das edge functions do checkout Mercado Pago.
# O caminho principal de deploy é via Supabase MCP na sessão de desenvolvimento.
#
# Secrets necessários no GitHub: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# Secret da function (painel Supabase > Edge Functions > Secrets):
#   MERCADO_PAGO_ACCESS_TOKEN (obrigatório)
#   APP_BASE_URL, MP_PRICE_ANNUAL, MP_PRICE_LIFETIME (opcionais)

name: Deploy Edge Functions (Mercado Pago)

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Montar layout supabase/functions esperado pelo CLI
        run: |
          mkdir -p supabase/functions
          cp -r app/backend/edge_functions/mercadopago-webhook supabase/functions/
          cp -r app/backend/edge_functions/mp-create-checkout supabase/functions/

      - name: Deploy das functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Webhook sem JWT: o Mercado Pago não envia Authorization; a validação
          # é feita buscando o pagamento na API do MP dentro da function.
          supabase functions deploy mercadopago-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy mp-create-checkout --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
